<!doctype html>
<html lang="{{ locale }}">
<head><meta charset="utf-8"><title>{{ t.subject }}</title></head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center">
      <table role="presentation" width="560" cellspacing="0" cellpadding="0"
             style="max-width:560px;background:#ffffff;border-radius:12px;padding:32px;">
        <tr><td style="font-size:20px;font-weight:bold;color:#4f46e5;padding-bottom:16px;">BiletFlow</td></tr>
        <tr><td style="font-size:22px;font-weight:bold;padding-bottom:12px;">{{ t.title }}</td></tr>
        <tr><td style="font-size:15px;line-height:1.5;padding-bottom:24px;">{{ t.body }}</td></tr>
        {% if link %}
        <tr><td style="padding-bottom:24px;">
          <a href="{{ link }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;
             padding:12px 20px;border-radius:8px;font-weight:bold;">{{ t.cta }}</a>
        </td></tr>
        {% endif %}
        {% if app_link %}
        <tr><td style="font-size:14px;padding-bottom:24px;">
          <a href="{{ app_link }}" style="color:#4f46e5;">{{ t.app_cta }}</a>
        </td></tr>
        {% endif %}
        {% if t.note %}<tr><td style="font-size:13px;color:#71717a;">{{ t.note }}</td></tr>{% endif %}
      </table>
    </td></tr>
  </table>
</body>
</html>
