name: biletflow

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://biletflow:biletflow@db:5432/biletflow
  SMTP_HOST: mail
  SMTP_PORT: "1025"
  S3_ENDPOINT_URL: http://storage:9000

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      mail:
        condition: service_started

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  storage:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/biletflow
      "
    restart: "no"

  # Manual backup: docker compose --profile tools run --rm backup
  # Restore:       docker compose exec -T db pg_restore -U biletflow -d biletflow --clean < backups/<file>.dump
  backup:
    image: postgres:16
    profiles: ["tools"]
    environment:
      PGPASSWORD: biletflow
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c "pg_dump -h db -U biletflow -d biletflow -Fc -f /backups/biletflow_$$(date +%Y%m%d_%H%M%S).dump && ls -l /backups"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
